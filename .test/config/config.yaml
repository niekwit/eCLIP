# Notes:
# Use Python style for boolean values (True/False)
genome: hg38 # hg38 (GENCODE v29), hg19 (GENCODE v19) or mm10 (GENCODE vM25)
demultiplexed: False # Paired-end only: reads are already demultiplexed (inline barcodes removed, UMI in read name), e.g. FASTQ files from the ENCODE portal
umi:
  se_length: 10 # Length of UMI (random-mer) at the 5' end of read 1 of single-end eCLIP (umi_tools extract)
  pe_length: 5 # Length of UMI (random-mer) of paired-end eCLIP (eclipdemux --length)
cutadapt: # ENCODE runs cutadapt twice (round 1: -O 1, round 2: -O 5) to remove double ligation events
  se_adapter: InvRil19 # Default adapter set for single-end reads: InvRil19 or InvRNA1 - InvRNA8 (can be set per sample in samples.csv)
  error_rate: 0.1
  quality_cutoff: 6
  min_length: 18
star:
  repeats_extra: "" # Extra parameters for STAR mapping to repeat elements
  genome_extra: "" # Extra parameters for STAR mapping to the genome
umi_tools:
  dedup_stats: True # Write umi_tools dedup stats (requires a lot of memory)
clipper:
  extra: "--gene ENSG00000154639 --gene ENSG00000154640 --gene ENSG00000154642 --gene ENSG00000154645 --gene ENSG00000154646 --gene ENSG00000155304 --gene ENSG00000155307 --gene ENSG00000155313 --gene ENSG00000166351 --gene ENSG00000180530 --gene ENSG00000185272 --gene ENSG00000188992 --gene ENSG00000273590 --gene ENSG00000274276 --gene ENSG00000274391 --gene ENSG00000274559 --gene ENSG00000275464 --gene ENSG00000275895 --gene ENSG00000275993 --gene ENSG00000276076 --gene ENSG00000276289 --gene ENSG00000276612 --gene ENSG00000277117 --gene ENSG00000277277 --gene ENSG00000278961 --gene ENSG00000279493 --gene ENSG00000280071 --gene ENSG00000280433"  # Extra parameters for CLIPper
peaks:
  l10p: 3 # -log10(p-value) cutoff for significant peaks (narrowPeak score and total entropy)
  l2fc: 3 # log2 fold change (over size-matched input) cutoff for significant peaks
resources: # computing resources
  trim:
    cpu: 8
    time: 60
  fastqc:
    cpu: 4
    time: 60
  star_index:
    cpu: 36
    time: 90
  mapping:
    cpu: 12
    time: 120
  samtools:
    cpu: 4
    time: 60
  umi_tools:
    cpu: 4
    time: 240
  bigwig:
    cpu: 2
    time: 60
  clipper:
    cpu: 12
    time: 240
  peaks:
    cpu: 2
    time: 240
  idr:
    cpu: 2
    time: 120
